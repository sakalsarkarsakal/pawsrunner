<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paws Runner - Endless Dog Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8C8 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: transparent;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #startScreen h1, #gameOverScreen h1 {
            color: #fff;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
        }

        #startScreen p, #gameOverScreen p {
            color: #ddd;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 30px;
        }

        button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(245,87,108,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(245,87,108,0.6);
        }

        button:active {
            transform: translateY(-1px);
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .stat {
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        #gameOverStats {
            color: #fff;
            margin: 20px 0;
            font-size: 18px;
            text-align: center;
        }

        .stat-line {
            margin: 8px 0;
        }

        .hidden {
            display: none !important;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse {
            animation: pulse 0.5s ease-in-out;
        }

        /* Mobile responsive */
        @media (max-width: 500px) {
            #gameContainer {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div id="hud">
            <div class="stat">
                <span>🏃 </span>
                <span id="distance">0m</span>
            </div>
            <div class="stat">
                <span>🪙 </span>
                <span id="coins">0</span>
            </div>
            <div class="stat">
                <span>⭐ </span>
                <span id="score">0</span>
            </div>
        </div>

        <div id="startScreen">
            <h1>🐕 Paws Runner</h1>
            <p>Swipe or use Arrow Keys to move<br>Collect coins and avoid obstacles!</p>
            <button id="startBtn">START GAME</button>
            <div style="margin-top: 30px; color: #999; font-size: 14px;">
                ← → Arrow Keys or Swipe to move<br>
                ↑ Space to Jump
            </div>
        </div>

        <div id="gameOverScreen" class="hidden">
            <h1>💥 Game Over!</h1>
            <div id="gameOverStats">
                <div class="stat-line">Distance: <span id="finalDistance">0m</span></div>
                <div class="stat-line">Coins: <span id="finalCoins">0</span></div>
                <div class="stat-line">Score: <span id="finalScore">0</span></div>
                <div class="stat-line" style="color: #FFD700;">⭐ Best: <span id="bestScore">0</span></div>
            </div>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>

        <div id="controls">
            ← → Move | ↑ Jump | Swipe to Play
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Game state
        let gameState = 'menu'; // menu, playing, gameover
        let score = 0;
        let distance = 0;
        let coins = 0;
        let bestScore = localStorage.getItem('bestScore') || 0;
        let gameSpeed = 5;
        let frame = 0;

        // Player (dog)
        const player = {
            x: 200,
            y: 450,
            width: 40,
            height: 40,
            lane: 1, // 0=left, 1=center, 2=right
            targetX: 200,
            jumping: false,
            jumpVelocity: 0,
            gravity: 0.8,
            jumpPower: -15,
            color: '#FF6B35'
        };

        // Lanes
        const lanes = [120, 200, 280];

        // Obstacles
        let obstacles = [];
        let obstacleTimer = 0;

        // Coins
        let coinsList = [];
        let coinTimer = 0;

        // Particle effects
        let particles = [];

        // Input handling
        let keys = {};
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (gameState === 'playing') {
                if (e.key === 'ArrowLeft' && player.lane > 0) {
                    player.lane--;
                    player.targetX = lanes[player.lane];
                }
                if (e.key === 'ArrowRight' && player.lane < 2) {
                    player.lane++;
                    player.targetX = lanes[player.lane];
                }
                if ((e.key === 'ArrowUp' || e.key === ' ') && !player.jumping) {
                    player.jumping = true;
                    player.jumpVelocity = player.jumpPower;
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Touch controls
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (gameState !== 'playing') return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // Horizontal swipe
                if (deltaX > 30 && player.lane < 2) {
                    player.lane++;
                    player.targetX = lanes[player.lane];
                } else if (deltaX < -30 && player.lane > 0) {
                    player.lane--;
                    player.targetX = lanes[player.lane];
                }
            } else {
                // Vertical swipe
                if (deltaY < -30 && !player.jumping) {
                    player.jumping = true;
                    player.jumpVelocity = player.jumpPower;
                }
            }
        });

        // Start game
        function startGame() {
            gameState = 'playing';
            score = 0;
            distance = 0;
            coins = 0;
            gameSpeed = 5;
            frame = 0;
            player.lane = 1;
            player.x = 200;
            player.y = 450;
            player.targetX = lanes[1];
            player.jumping = false;
            obstacles = [];
            coinsList = [];
            particles = [];
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            updateHUD();
        }

        // Game over
        function gameOver() {
            gameState = 'gameover';

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('bestScore', bestScore);
            }

            document.getElementById('finalDistance').textContent = Math.floor(distance) + 'm';
            document.getElementById('finalCoins').textContent = coins;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('bestScore').textContent = bestScore;

            gameOverScreen.classList.remove('hidden');
        }

        // Update HUD
        function updateHUD() {
            document.getElementById('distance').textContent = Math.floor(distance) + 'm';
            document.getElementById('coins').textContent = coins;
            document.getElementById('score').textContent = score;
        }

        // Create obstacle
        function createObstacle() {
            const lane = Math.floor(Math.random() * 3);
            const type = Math.random() > 0.5 ? 'box' : 'triangle';
            obstacles.push({
                x: lanes[lane],
                y: -50,
                width: 35,
                height: type === 'box' ? 40 : 50,
                type: type,
                color: '#E63946'
            });
        }

        // Create coin
        function createCoin() {
            const lane = Math.floor(Math.random() * 3);
            const pattern = Math.random();

            if (pattern < 0.7) {
                // Single coin
                coinsList.push({
                    x: lanes[lane],
                    y: -30,
                    radius: 15,
                    collected: false
                });
            } else {
                // Line of coins
                for (let i = 0; i < 4; i++) {
                    coinsList.push({
                        x: lanes[lane],
                        y: -30 - (i * 50),
                        radius: 15,
                        collected: false
                    });
                }
            }
        }

        // Create particle effect
        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 30,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        // Check collision
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Update game
        function update() {
            if (gameState !== 'playing') return;

            frame++;
            distance += gameSpeed / 60;
            score = Math.floor(distance * 10 + coins * 5);

            // Increase speed over time
            if (frame % 600 === 0) {
                gameSpeed += 0.5;
            }

            // Move player to target lane
            if (player.x < player.targetX) {
                player.x += 10;
            } else if (player.x > player.targetX) {
                player.x -= 10;
            }

            // Jumping
            if (player.jumping) {
                player.jumpVelocity += player.gravity;
                player.y += player.jumpVelocity;

                if (player.y >= 450) {
                    player.y = 450;
                    player.jumping = false;
                    player.jumpVelocity = 0;
                }
            }

            // Spawn obstacles
            obstacleTimer++;
            if (obstacleTimer > 80 - gameSpeed * 2) {
                createObstacle();
                obstacleTimer = 0;
            }

            // Spawn coins
            coinTimer++;
            if (coinTimer > 120) {
                createCoin();
                coinTimer = 0;
            }

            // Update obstacles
            obstacles.forEach((obs, index) => {
                obs.y += gameSpeed;

                // Check collision with player
                if (checkCollision(player, obs)) {
                    createParticles(player.x + 20, player.y + 20, '#E63946', 15);
                    gameOver();
                }

                // Remove off-screen obstacles
                if (obs.y > canvas.height) {
                    obstacles.splice(index, 1);
                }
            });

            // Update coins
            coinsList.forEach((coin, index) => {
                coin.y += gameSpeed;

                // Check collection
                const dist = Math.sqrt(
                    Math.pow(coin.x - (player.x + 20), 2) +
                    Math.pow(coin.y - (player.y + 20), 2)
                );

                if (dist < 30 && !coin.collected) {
                    coin.collected = true;
                    coins++;
                    score += 5;
                    createParticles(coin.x, coin.y, '#FFD700', 10);
                    coinsList.splice(index, 1);
                }

                // Remove off-screen coins
                if (coin.y > canvas.height) {
                    coinsList.splice(index, 1);
                }
            });

            // Update particles
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                if (p.life <= 0) {
                    particles.splice(index, 1);
                }
            });

            updateHUD();
        }

        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw ground pattern
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, 500, canvas.width, 100);

            // Draw lane lines
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(80 + i * 80, 0);
                ctx.lineTo(80 + i * 80, 500);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Draw obstacles
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                if (obs.type === 'box') {
                    ctx.fillRect(obs.x - obs.width/2, obs.y, obs.width, obs.height);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y);
                    ctx.lineTo(obs.x - obs.width/2, obs.y + obs.height);
                    ctx.lineTo(obs.x + obs.width/2, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();
                }

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(obs.x - obs.width/2, 490, obs.width, 10);
            });

            // Draw coins
            coinsList.forEach(coin => {
                if (!coin.collected) {
                    // Coin
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                    ctx.fill();

                    // Shine effect
                    ctx.fillStyle = '#FFF8DC';
                    ctx.beginPath();
                    ctx.arc(coin.x - 5, coin.y - 5, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.1)';
                    ctx.beginPath();
                    ctx.arc(coin.x, 495, coin.radius * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Draw particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1;

            // Draw player (dog)
            // Body
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Head
            ctx.beginPath();
            ctx.arc(player.x + 20, player.y - 10, 15, 0, Math.PI * 2);
            ctx.fill();

            // Ears
            ctx.fillStyle = '#D95030';
            ctx.beginPath();
            ctx.arc(player.x + 10, player.y - 15, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + 30, player.y - 15, 8, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x + 15, player.y - 12, 3, 3);
            ctx.fillRect(player.x + 22, player.y - 12, 3, 3);

            // Nose
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(player.x + 20, player.y - 5, 3, 0, Math.PI * 2);
            ctx.fill();

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(player.x + 20, 495, 25, 8, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Start game loop
        gameLoop();
    </script>
</body>
</html>
